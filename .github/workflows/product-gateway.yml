name: Product gateway boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt 'pydantic-settings>=2.1.0' 'pytest>=8.4.2'
      - run: python -m pytest api/tests/test_gateway.py api/tests/test_query_failure.py -q
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt -e services/auth
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/check_auth_http.py
      - run: python scripts/check_product_http.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-browser-evidence
          path: artifacts/product-browser
