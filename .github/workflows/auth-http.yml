name: Auth HTTP persistence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e services/auth
      - run: python scripts/check_auth_http.py
